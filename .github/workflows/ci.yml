# One job: the install dominates the runtime, so parallel jobs would pay for it repeatedly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests only: every `main` commit needs its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every action is pinned to a commit, because whoever owns the action can move a tag.
# The comment after each pin names the version that commit was.

jobs:
  verify:
    runs-on: ubuntu-latest
    # Long enough for a cold install plus the browser download, short enough
    # that a hung step is a failed run rather than six hours of a runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Covers the test files too, which the per-package build configs exclude.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Only chromium, and only its own dependencies: the suite covers behaviour
      # this project owns, not rendering differences between engines.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm e2e

      - name: Keep the trace from a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Builds the playground with `--mode dist`, which skips `aliases.ts`, so the
      # packages and their two stylesheets resolve through the published exports.
      - name: Production package smoke
        run: pnpm e2e:dist

      # A script rather than an inline block, so the check can be run locally.
      - name: Check build output
        run: node scripts/check-dist.mjs
