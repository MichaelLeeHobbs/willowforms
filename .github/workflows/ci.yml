# Every gate that decides whether a change is safe to merge.
#
# One job rather than four parallel ones: the install dominates the runtime here,
# and splitting would pay for it four times to save a few seconds of checks.
# Revisit if the test suite grows past a couple of minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a commit, with the version it was in the comment.
#
# A tag is a mutable pointer: whoever owns the action can move `v4` onto any
# commit at any time, and every workflow in the world picks it up on the next
# run without a diff anywhere. A commit hash cannot be moved. The cost is that
# bumps are manual, so the comment names the version each hash was, and the
# hashes here are the tip of v4 as of 2026-08-31. Majors have moved on since
# (checkout and setup-node are at v7, upload-artifact at v7, action-setup at
# v6); those bumps need a CI run to verify and are not something to make blind.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Covers the test files too, which the per-package build configs exclude.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Only chromium, and only its own dependencies: the suite covers behaviour
      # this project owns, not rendering differences between engines.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm e2e

      - name: Keep the trace from a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # dist is what consumers actually get, so prove it exists and carries types.
      #
      # A script rather than a shell block, because a check written inline here
      # is a check nobody can run. This one had drifted: its package list named
      # four of the five, and the one it left out was `kit-html`, which is the
      # package the second-kit claim rests on.
      - name: Check build output
        run: node scripts/check-dist.mjs
