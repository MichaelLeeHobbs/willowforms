# Every gate that decides whether a change is safe to merge.
#
# One job rather than four parallel ones: the install dominates the runtime here,
# and splitting would pay for it four times to save a few seconds of checks.
# Revisit if the test suite grows past a couple of minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Covers the test files too, which the per-package build configs exclude.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Only chromium, and only its own dependencies: the suite covers behaviour
      # this project owns, not rendering differences between engines.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm e2e

      - name: Keep the trace from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # dist is what consumers actually get, so prove it exists and carries types.
      #
      # A script rather than a shell block, because a check written inline here
      # is a check nobody can run. This one had drifted: its package list named
      # four of the five, and the one it left out was `kit-html`, which is the
      # package the second-kit claim rests on.
      - name: Check build output
        run: node scripts/check-dist.mjs
