# One job: the install dominates the runtime, so parallel jobs would pay for it repeatedly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests only: every `main` commit needs its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every action is pinned to a commit, with the version it was in the comment.
#
# A tag is a mutable pointer: whoever owns the action can move `v4` onto any
# commit at any time, and every workflow in the world picks it up on the next
# run without a diff anywhere. A commit hash cannot be moved. The cost is that
# bumps are manual, so the comment names the version each hash was, and the
# hashes here are the tip of v4 as of 2026-08-31. Majors have moved on since
# (checkout and setup-node are at v7, upload-artifact at v7, action-setup at
# v6); those bumps need a CI run to verify and are not something to make blind.

jobs:
  verify:
    runs-on: ubuntu-latest
    # Long enough for a cold install plus the browser download, short enough
    # that a hung step is a failed run rather than six hours of a runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Covers the test files too, which the per-package build configs exclude.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Only chromium, and only its own dependencies: the suite covers behaviour
      # this project owns, not rendering differences between engines.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm e2e

      - name: Keep the trace from a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # The playground, which is the only thing that imports the two stylesheets
      # by their published subpaths -- `@willowforms/designer/styles.css` and
      # `@willowforms/kit-html/styles.css`. `aliases.ts` resolves those with
      # anchored regexes, and its own docblock records that a plain string alias
      # rewrites them into the source directory and breaks the build. Nothing in
      # CI ever ran that build, so the failure it describes would have reached a
      # release rather than a run.
      - name: Production package smoke
        run: pnpm e2e:dist

      # A script rather than an inline block, so the check can be run locally.
      - name: Check build output
        run: node scripts/check-dist.mjs
