name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its run. Every push to `main` needs its own verdict, so
# each gets its own group: a shared one queues them and cancels all but the newest one waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every action is pinned to a commit, because whoever owns the action can move a tag.
# The comment after each pin names the version that commit was.

# Separate jobs, so the browser suite does not wait for the other checks (#184).
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Covers the test files too, which the per-package build configs exclude.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --maxWorkers=100%

  # The peer range's other major. The lockfile pins React 19, so this job resolves again.
  react-18:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install on React 18
        run: node scripts/use-react-18.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --maxWorkers=100%

  browser:
    runs-on: ubuntu-latest
    # Keep above `globalTimeout` in playwright.config.ts plus the steps around the suite.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # A script rather than an inline block, so the check can be run locally.
      - name: Check build output
        run: node scripts/check-dist.mjs

      # Only chromium: the suite covers behaviour this project owns, not rendering differences
      # between engines. No `--with-deps`: the runner image has every library chromium needs.
      - name: Install the browser
        run: pnpm exec playwright install --only-shell chromium

      - name: End-to-end
        run: pnpm e2e

      # Builds the playground with `--mode dist`, which skips `aliases.ts`, so the
      # packages and their two stylesheets resolve through the published exports.
      - name: Production package smoke
        run: pnpm e2e:dist

      - name: Keep the trace from a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
